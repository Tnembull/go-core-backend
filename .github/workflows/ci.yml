name: "Go Core Backend CI & Security Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit-and-tests:
    name: "DevSecOps Gates, Newman API Suite & Container Scan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Secret Detection (Gitleaks)"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: "Download Go Dependencies"
        run: go mod download

      - name: "Go Vet Static Analysis"
        run: go vet ./...

      - name: "Run Go Unit & Integration Tests"
        run: go test -v ./...

      - name: "Set up Node.js for Newman"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Install Newman (Postman / Apidog CLI Runner)"
        run: npm install -g newman

      - name: "Execute Automated Postman / Apidog Suite"
        run: |
          chmod +x ./tests/run_e2e_newman.sh
          ./tests/run_e2e_newman.sh

      - name: "Build Hardened Production Docker Image"
        run: |
          docker build -t go-core-backend:${{ github.sha }} .

      - name: "Container Vulnerability Scan (Aqua Trivy)"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "go-core-backend:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

name: "Go Core Backend CI & API Testing"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    name: "Go Unit Tests & Newman Postman/Apidog Suite"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: "Download Go Dependencies"
        run: go mod download

      - name: "Go Vet Static Analysis"
        run: go vet ./...

      - name: "Run Go Unit & Integration Tests"
        run: go test -v ./...

      - name: "Set up Node.js for Newman"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Install Newman (Postman / Apidog CLI Runner)"
        run: npm install -g newman

      - name: "Execute Automated Postman / Apidog Collection Tests"
        run: |
          chmod +x ./tests/run_e2e_newman.sh
          ./tests/run_e2e_newman.sh

      - name: "Build Production Docker Container Image"
        run: |
          docker build -t go-core-backend:${{ github.sha }} .
